<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&family=Marcellus&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0A0A0A; font-family:'Josefin Sans',sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:8px; user-select:none;
  }
  #wrap {
    position:relative; border:2px solid #D4AF37; border-radius:0px;
    overflow:hidden; cursor:crosshair; background:#0D1524;
    box-shadow:0 0 18px rgba(212,175,55,0.15);
  }
  canvas { display:block; }
  .bar { display:flex; align-items:center; gap:12px; margin-top:12px; flex-wrap:wrap; justify-content:center; }
  .bar button {
    font-family:'Marcellus',serif; letter-spacing:0.15em; text-transform:uppercase;
    font-size:12px; padding:9px 20px; border-radius:0px; cursor:pointer;
    border:1px solid #D4AF37; background:transparent; color:#D4AF37; transition:all .35s ease;
  }
  .bar button:hover { background:#D4AF37; color:#0A0A0A; box-shadow:0 0 14px rgba(212,175,55,0.4); transform:translateY(-2px); }
  .bar button.go { background:rgba(212,175,55,0.1); border:2px solid #D4AF37; color:#F2E8C4; }
  .bar button.go:hover { background:#D4AF37; color:#0A0A0A; box-shadow:0 0 20px rgba(212,175,55,0.6); }
  .bar button.go.dim { opacity:.35; box-shadow:none; cursor:not-allowed; }
  #count {
    font-family:'Josefin Sans',sans-serif; font-size:12px; color:#F2E8C4;
    background:#141414; border:1px solid rgba(212,175,55,0.3); border-radius:0px;
    padding:6px 16px; min-width:92px; text-align:center; letter-spacing:0.1em;
  }
  #hint { font-size:10px; color:#888888; letter-spacing:0.08em; margin-top:8px;
    font-family:'Josefin Sans',sans-serif; text-align:center; text-transform:uppercase; }
  #toast {
    position:fixed; top:14px; left:50%; transform:translateX(-50%) translateY(-8px);
    background:#D4AF37; color:#0A0A0A; font-family:'Marcellus',serif; letter-spacing:0.15em;
    padding:9px 26px; border-radius:0px; font-size:13px; opacity:0; text-transform:uppercase;
    pointer-events:none; transition:all .3s ease; z-index:99; box-shadow:0 0 22px rgba(212,175,55,0.5);
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div id="wrap"><canvas id="c"></canvas></div>
  <div class="bar">
    <button id="saveBtn" class="go dim">◆ Commit Shape</button>
    <button id="undoBtn">Undo</button>
    <button id="clearBtn">Clear</button>
    <span id="count">0 pts</span>
  </div>
  <div id="hint">click to add nodes · click the gold origin to close · Enter commits · ⌫ undo · Esc clears</div>
  <div id="toast">Shape Archived</div>

<script>
  function send(type, data) {
    window.parent.postMessage(
      Object.assign({ isStreamlitMessage: true, type: "streamlit:" + type }, data), "*");
  }
  function setValue(v)  { send("setComponentValue", { value: v, dataType: "json" }); }
  function setHeight(h) { send("setFrameHeight", { height: h }); }

  const cv  = document.getElementById("c");
  const ctx = cv.getContext("2d");
  const img = new Image();

  let W = 0, H = 0, dpr = window.devicePixelRatio || 1;
  let pts = [], mode = "polygon", accent = "#D4AF37", nonce = 0;
  let cursor = null, lastImage = null, imgReady = false;

  const MIN = () => (mode === "line" ? 2 : 3);
  const MAX = () => (mode === "line" ? 2 : 99);

  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || d.type !== "streamlit:render") return;
    const a = d.args || {};
    W = a.width || 640; H = a.height || 480;
    mode = a.mode || "polygon";
    accent = a.accent || "#D4AF37";
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + "px"; cv.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (a.image_b64 && a.image_b64 !== lastImage) {
      lastImage = a.image_b64; pts = []; imgReady = false;
      img.onload = () => { imgReady = true; };
      img.src = "data:image/png;base64," + a.image_b64;
    }
    setHeight(H + 96);
    updateUI();
  });

  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    if (imgReady) ctx.drawImage(img, 0, 0, W, H);
    const n = pts.length;
    if (n > 0) {
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < n; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      if (mode === "polygon" && n >= 3) {
        ctx.closePath();
        ctx.fillStyle = "rgba(212,175,55,.12)";
        ctx.fill();
      }
      ctx.strokeStyle = accent; ctx.lineWidth = 2.5; ctx.lineJoin = "round"; ctx.stroke();
    }
    if (cursor && n > 0 && n < MAX()) {
      ctx.beginPath(); ctx.setLineDash([6, 6]);
      ctx.moveTo(pts[n-1][0], pts[n-1][1]);
      ctx.lineTo(cursor[0], cursor[1]);
      ctx.strokeStyle = accent; ctx.lineWidth = 1.5; ctx.globalAlpha = .6; ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    for (let i = 0; i < n; i++) {
      const isOrigin = i === 0;
      const r = isOrigin ? 7 + Math.sin(t / 300) * 1.5 : 5.5;
      ctx.beginPath();
      ctx.arc(pts[i][0], pts[i][1], r, 0, Math.PI * 2);
      ctx.fillStyle = isOrigin ? "#F2E8C4" : accent;
      ctx.fill();
      ctx.strokeStyle = "#0A0A0A"; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = "#F2E8C4";
      ctx.font = "bold 10px 'Josefin Sans',sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(String(i + 1), pts[i][0], pts[i][1] - 11);
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  function canvasPos(e) {
    const r = cv.getBoundingClientRect();
    return [ (e.clientX - r.left) * (W / r.width), (e.clientY - r.top) * (H / r.height) ];
  }
  cv.addEventListener("mousemove", (e) => { cursor = canvasPos(e); });
  cv.addEventListener("mouseleave", () => { cursor = null; });
  cv.addEventListener("click", (e) => {
    const p = canvasPos(e);
    const n = pts.length;
    if (mode === "polygon" && n >= 3) {
      const d = Math.hypot(p[0]-pts[0][0], p[1]-pts[0][1]);
      if (d < 14) { save(); return; }
    }
    if (n >= MAX()) return;
    pts.push([ Math.round(p[0]*10)/10, Math.round(p[1]*10)/10 ]);
    updateUI();
  });

  function save() {
    if (pts.length < MIN()) return;
    nonce += 1;
    setValue({ points: pts, nonce: nonce, mode: mode });
    showToast();
    pts = [];
    updateUI();
  }
  function undo()  { if (pts.length) { pts.pop(); updateUI(); } }
  function clear() { pts = []; updateUI(); }

  document.getElementById("saveBtn").addEventListener("click", save);
  document.getElementById("undoBtn").addEventListener("click", undo);
  document.getElementById("clearBtn").addEventListener("click", clear);
  window.addEventListener("keydown", (e) => {
    if (e.key === "Enter") save();
    else if (e.key === "Backspace") { e.preventDefault(); undo(); }
    else if (e.key === "Escape") clear();
  });

  function updateUI() {
    const n = pts.length;
    document.getElementById("count").textContent = mode === "line" ? n + " / 2 pts" : n + " pts";
    document.getElementById("saveBtn").classList.toggle("dim", n < MIN());
  }
  function showToast() {
    const t = document.getElementById("toast");
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1400);
  }

  send("componentReady", { apiVersion: 1 });
</script>
</body>
</html>
