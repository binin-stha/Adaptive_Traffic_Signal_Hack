<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Overpass:wght@600;800&family=JetBrains+Mono:wght@400;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0B1220;
    font-family:'Overpass',sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:8px; user-select:none;
  }
  #wrap {
    position:relative; border:1px solid #2A3B55; border-radius:10px;
    overflow:hidden; cursor:crosshair; background:#0D1524;
    box-shadow:0 8px 32px rgba(0,0,0,.45);
  }
  canvas { display:block; }
  .bar {
    display:flex; align-items:center; gap:10px; margin-top:10px; flex-wrap:wrap;
    justify-content:center;
  }
  .bar button {
    font-family:'Overpass',sans-serif; font-weight:800; letter-spacing:.08em;
    font-size:12px; padding:8px 18px; border-radius:8px; cursor:pointer;
    border:1px solid #2A3B55; background:#141E2E; color:#F1F5F9;
    transition:all .18s ease; text-transform:uppercase;
  }
  .bar button:hover { transform:translateY(-1px); background:#1C2A3E; }
  .bar button.go { background:#22C55E; border-color:#22C55E; color:#04110B;
    box-shadow:0 0 0 0 rgba(34,197,94,.4); }
  .bar button.go:hover { background:#2EE06F; box-shadow:0 0 18px rgba(34,197,94,.45); }
  .bar button.go.dim { opacity:.35; box-shadow:none; cursor:not-allowed; }
  #count {
    font-family:'JetBrains Mono',monospace; font-size:12px; color:#94A3B8;
    background:#0D1524; border:1px solid #1E293B; border-radius:99px;
    padding:5px 14px; min-width:88px; text-align:center;
  }
  #hint { font-size:10px; color:#5A6B85; letter-spacing:.06em; margin-top:6px;
    font-family:'JetBrains Mono',monospace; text-align:center; }
  #toast {
    position:fixed; top:14px; left:50%; transform:translateX(-50%) translateY(-8px);
    background:#22C55E; color:#04110B; font-weight:800; letter-spacing:.06em;
    padding:8px 22px; border-radius:99px; font-size:13px; opacity:0;
    pointer-events:none; transition:all .3s ease; z-index:99;
    box-shadow:0 6px 24px rgba(34,197,94,.4);
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div id="wrap"><canvas id="c"></canvas></div>
  <div class="bar">
    <button id="saveBtn" class="go dim">Save Shape</button>
    <button id="undoBtn">Undo</button>
    <button id="clearBtn">Clear</button>
    <span id="count">0 pts</span>
  </div>
  <div id="hint">click to add points · click the gold origin to close · Enter saves · ⌫ undo · Esc clears</div>
  <div id="toast">SHAPE SAVED</div>

<script>
  // ── Streamlit component protocol ────────────────────────────────────────
  function send(type, data) {
    window.parent.postMessage(
      Object.assign({ isStreamlitMessage: true, type: "streamlit:" + type }, data),
      "*"
    );
  }
  function setValue(v)  { send("setComponentValue", { value: v, dataType: "json" }); }
  function setHeight(h) { send("setFrameHeight", { height: h }); }

  // ── State ───────────────────────────────────────────────────────────────
  const cv  = document.getElementById("c");
  const ctx = cv.getContext("2d");
  const img = new Image();

  let W = 0, H = 0, dpr = window.devicePixelRatio || 1;
  let pts = [];
  let mode = "polygon";
  let accent = "#3B82F6";
  let nonce = 0;
  let cursor = null;
  let lastImage = null;
  let imgReady = false;

  const MIN = () => (mode === "line" ? 2 : 3);
  const MAX = () => (mode === "line" ? 2 : 99);

  // ── Render args from Streamlit ──────────────────────────────────────────
  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || d.type !== "streamlit:render") return;
    const a = d.args || {};
    W = a.width || 640; H = a.height || 480;
    mode = a.mode || "polygon";
    accent = a.accent || "#3B82F6";

    cv.width  = W * dpr;
    cv.height = H * dpr;
    cv.style.width  = W + "px";
    cv.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (a.image_b64 && a.image_b64 !== lastImage) {
      lastImage = a.image_b64;
      pts = [];
      imgReady = false;
      img.onload = () => { imgReady = true; };
      img.src = "data:image/png;base64," + a.image_b64;
    }
    setHeight(H + 96);
    updateUI();
  });

  // ── Drawing ─────────────────────────────────────────────────────────────
  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    if (imgReady) ctx.drawImage(img, 0, 0, W, H);

    const n = pts.length;

    // shape edges + fill
    if (n > 0) {
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < n; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      if (mode === "polygon" && n >= 3) {
        ctx.closePath();
        ctx.fillStyle = "rgba(255,200,0,.12)";
        ctx.fill();
      }
      ctx.strokeStyle = accent;
      ctx.lineWidth = 2.5;
      ctx.lineJoin = "round";
      ctx.stroke();
    }

    // live preview line to cursor
    if (cursor && n > 0 && n < MAX()) {
      ctx.beginPath();
      ctx.setLineDash([6, 6]);
      ctx.moveTo(pts[n-1][0], pts[n-1][1]);
      ctx.lineTo(cursor[0], cursor[1]);
      ctx.strokeStyle = accent;
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = .6;
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }

    // vertices
    for (let i = 0; i < n; i++) {
      const isOrigin = i === 0;
      const r = isOrigin ? 7 + Math.sin(t / 300) * 1.5 : 5.5;
      ctx.beginPath();
      ctx.arc(pts[i][0], pts[i][1], r, 0, Math.PI * 2);
      ctx.fillStyle = isOrigin ? "#F59E0B" : accent;
      ctx.fill();
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = "#fff";
      ctx.font = "bold 10px 'JetBrains Mono',monospace";
      ctx.textAlign = "center";
      ctx.fillText(String(i + 1), pts[i][0], pts[i][1] - 11);
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  // ── Interaction ─────────────────────────────────────────────────────────
  function canvasPos(e) {
    const r = cv.getBoundingClientRect();
    return [ (e.clientX - r.left) * (W / r.width),
             (e.clientY - r.top)  * (H / r.height) ];
  }

  cv.addEventListener("mousemove", (e) => { cursor = canvasPos(e); });
  cv.addEventListener("mouseleave", () => { cursor = null; });

  cv.addEventListener("click", (e) => {
    const p = canvasPos(e);
    const n = pts.length;

    // click near the origin closes + saves a polygon
    if (mode === "polygon" && n >= 3) {
      const d = Math.hypot(p[0]-pts[0][0], p[1]-pts[0][1]);
      if (d < 14) { save(); return; }
    }
    if (n >= MAX()) return;

    pts.push([ Math.round(p[0]*10)/10, Math.round(p[1]*10)/10 ]);
    updateUI();
  });

  function save() {
    if (pts.length < MIN()) return;
    nonce += 1;
    setValue({ points: pts, nonce: nonce, mode: mode });
    showToast();
    pts = [];
    updateUI();
  }

  function undo()  { if (pts.length) { pts.pop(); updateUI(); } }
  function clear() { pts = []; updateUI(); }

  document.getElementById("saveBtn").addEventListener("click", save);
  document.getElementById("undoBtn").addEventListener("click", undo);
  document.getElementById("clearBtn").addEventListener("click", clear);

  window.addEventListener("keydown", (e) => {
    if (e.key === "Enter")        save();
    else if (e.key === "Backspace") { e.preventDefault(); undo(); }
    else if (e.key === "Escape")    clear();
  });

  function updateUI() {
    const n = pts.length;
    document.getElementById("count").textContent =
      mode === "line" ? n + " / 2 pts" : n + " pts";
    document.getElementById("saveBtn").classList.toggle("dim", n < MIN());
  }

  function showToast() {
    const t = document.getElementById("toast");
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1400);
  }

  // ── Ready ───────────────────────────────────────────────────────────────
  send("componentReady", { apiVersion: 1 });
  </script>
</body>
</html>
